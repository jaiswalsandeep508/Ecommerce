spring:
  datasource:
    url: jdbc:postgresql://inventory-postgres:5432/${INVENTORY_DATABASE}
    username: ${INVENTORY_USER}
    password: ${INVENTORY_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true