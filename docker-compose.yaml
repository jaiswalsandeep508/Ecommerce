services:
  eureka-server:
    image: eureka-server:v1
    container_name: eureka-server
    ports:
      - "${EUREKA_PORT}:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: ${EUREKA_PORT}
      EUREKA_REGISTER_WITH_EUREKA: false
      EUREKA_FETCH_REGISTRY: false
      EUREKA_SELF_PRESERVATION: true
      EUREKA_LOG_LEVEL: INFO
      DISCOVERY_LOG_LEVEL: INFO
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-network

  identity-mysql:
    image: mysql:8.4
    container_name: identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${IDENTITY_DATABASE}
      MYSQL_USER: ${IDENTITY_USER}
      MYSQL_PASSWORD: ${IDENTITY_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IDENTITY_ROOT_PASSWORD}
    ports:
      - "${IDENTITY_PORT}:3306"
    volumes:
      - identity-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${IDENTITY_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  identity-service:
    image: identity-microservice:v1
    container_name: identity-service
    ports:
      - "${IDENTITY_SERVICE_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_DATABASE: ${IDENTITY_DATABASE}
      IDENTITY_USER: ${IDENTITY_USER}
      IDENTITY_PASSWORD: ${IDENTITY_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-mysql:
        condition: service_healthy
    networks:
      - ecommerce-network

  catalog-mysql:
    image: mysql:8.4
    container_name: catalog-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CATALOG_DATABASE}
      MYSQL_USER: ${CATALOG_USER}
      MYSQL_PASSWORD: ${CATALOG_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CATALOG_ROOT_PASSWORD}
    ports:
      - "${CATALOG_PORT}:3306"
    volumes:
      - catalog-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${CATALOG_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  catalog-service:
    image: catalog-microservice:v1
    container_name: catalog-service
    ports:
      - "${CATALOG_SERVICE_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_DATABASE: ${CATALOG_DATABASE}
      CATALOG_USER: ${CATALOG_USER}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      catalog-mysql:
        condition: service_healthy
    networks:
      - ecommerce-network

  inventory-postgres:
    image: postgres:17
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DATABASE}
      POSTGRES_USER: ${INVENTORY_USER}
      POSTGRES_PASSWORD: ${INVENTORY_PASSWORD}
    ports:
      - "${INVENTORY_PORT}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${INVENTORY_USER} -d ${INVENTORY_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  inventory-service:
    image: inventory-microservice:v1
    container_name: inventory-service
    ports:
      - "${INVENTORY_SERVICE_PORT}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
      INVENTORY_DATABASE: ${INVENTORY_DATABASE}
      INVENTORY_USER: ${INVENTORY_USER}
      INVENTORY_PASSWORD: ${INVENTORY_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      inventory-postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  cart-redis:
    image: redis:7
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "${CART_REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  cart-service:
    image: cart-microservice:v1
    container_name: cart-service
    ports:
      - "${CART_PORT}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
      cart-redis:
        condition: service_healthy
    networks:
      - ecommerce-network

volumes:
  identity-mysql-data:
  catalog-mysql-data:
  inventory-postgres-data:

networks:
  ecommerce-network:
    driver: bridge
