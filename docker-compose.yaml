services:
  eureka-server:
    image: eureka-microservice:v1
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      SPRING_APPLICATION_NAME: Eureka-Server
      EUREKA_REGISTER_WITH_EUREKA: false
      EUREKA_FETCH_REGISTRY: false
      EUREKA_SELF_PRESERVATION: true
      EUREKA_LOG_LEVEL: INFO
      DISCOVERY_LOG_LEVEL: INFO

    healthcheck:
      test: ["CMD","wget","--spider","-q","http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - ecommerce-network

  identity-mysql:
    image: mysql:8.4
    container_name: identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - identity-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p{MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  identity-service:
    image: identity-microservice:v1
    container_name: identity-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-mysql:
        condition: service_healthy
    networks:
      - ecommerce-network

volumes:
  identity-mysql-data:

networks:
  ecommerce-network:
    driver: bridge
